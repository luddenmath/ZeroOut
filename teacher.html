      padding: 20px;
    }

    #teacherApp {
      width: min(750px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.1em;
    }

    .game-code {
      color: #aaa;
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }

    /* SETUP */

    .setup-section {
      background: #181818;
      border: 1px solid #444;
      border-radius: 15px;
      padding: 25px;
    }

    .setup-section h2 {
      margin-top: 0;
    }

    .instruction {
      color: #aaa;
      line-height: 1.5;
    }

    .alphabet {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin: 20px 0;
    }

    .letter-button {
      padding: 12px 5px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #242424;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .letter-button:hover {
      background: #333;
    }

    .letter-button.selected {
      background: white;
      color: black;
      border-color: white;
    }

    .selected-info {
      margin-bottom: 10px;
    }

    .selected-letters {
      min-height: 35px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .selected-letter {
      background: #333;
      border-radius: 6px;
      padding: 6px 10px;
      font-weight: bold;
    }

    /* CURRENT VALUE */

    .current-value {
      text-align: center;
      background: #181818;
      border: 1px solid #444;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .label {
      color: #aaa;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
    }

    #currentValue {
      font-size: 5rem;
      font-weight: bold;
      line-height: 1.1;
      margin-top: 5px;
    }

    /* TEAMS */

    .teams {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .team-button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #181818;
      border: 2px solid #444;
      border-radius: 12px;
      padding: 15px 20px;
      color: white;
      cursor: pointer;
      text-align: left;
      transition:
        background 0.15s,
        border-color 0.15s;
    }

    .team-button:hover {
      background: #292929;
      border-color: #777;
    }

    .team-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .animal {
      font-size: 2rem;
    }

    .score {
      font-size: 1.5rem;
      font-weight: bold;
      white-space: nowrap;
    }

    /* CONTROL SECTIONS */

    .section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #333;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
    }

    button {
      font: inherit;
    }

    .control-button {
      width: 100%;
      padding: 13px 15px;
      margin-top: 8px;
      border-radius: 9px;
      border: 1px solid #555;
      background: #242424;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .control-button:hover {
      background: #333;

    .primary {

      color: black;
      border-color: white;

    }

    }

    .danger {

    }

    .danger:hover {
      background: #902020;
    }

      text-align: center;
      font-size: 2.5rem;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      min-height: 50px;
      margin-bottom: 10px;
    }

    .timer-display.warning {
      animation: timerPulse 1s infinite;
    }

    @keyframes timerPulse {

      }
    }

    .timer-input-row {

      align-items: center;
      justify-content: center;
      gap: 8px;

      background: #222;
      color: white;

      }

        grid-template-columns: repeat(6, 1fr);

/* =========================================================
   SETUP
========================================================= */

let selectedLetters = [];

const alphabetElement =
document.getElementById("alphabet");

const selectedCountElement =
document.getElementById("selectedCount");

const selectedLettersElement =
document.getElementById("selectedLetters");

const startGameButton =
document.getElementById("startGame");

const setupSection =
document.getElementById("setupSection");

const gameSection =
document.getElementById("gameSection");


function createAlphabet() {

  const letters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  letters.split("").forEach(letter => {

    const button =
      document.createElement("button");

    button.className =
      "letter-button";

    button.textContent =
      letter;

    button.addEventListener(
      "click",
      () => toggleLetter(letter, button)
    );

    alphabetElement.appendChild(button);

  });

}


function toggleLetter(letter, button) {

  const index =
    selectedLetters.indexOf(letter);

  if (index === -1) {

    selectedLetters.push(letter);

    button.classList.add("selected");

  } else {

    selectedLetters.splice(index, 1);

    button.classList.remove("selected");

  }

  updateTeamSelectionDisplay();

}


function updateTeamSelectionDisplay() {

  selectedCountElement.textContent =
    selectedLetters.length;

  selectedLettersElement.innerHTML = "";

  selectedLetters.forEach(letter => {

    const element =
      document.createElement("span");

    element.className =
      "selected-letter";

    element.textContent =
      letter;

    selectedLettersElement.appendChild(
      element
    );

  });

  startGameButton.disabled =
    selectedLetters.length === 0;

}


/* =========================================================
   ASSIGN ANIMALS
========================================================= */

function assignAnimals(letters) {

  const usedAnimals = [];

  return letters.map((letter, index) => {

    const available =
      animals[letter].filter(
        animal =>
          !usedAnimals.includes(animal.name)
      );

    const pool =
      available.length > 0
        ? available
        : animals[letter];

    const animal =
      pool[
        Math.floor(
          Math.random() * pool.length
        )
      ];

    usedAnimals.push(animal.name);

    return {

      id:
        `${letter}-${index}-${Date.now()}`,

      letter,

      name: animal.name,

      emoji: animal.emoji,

      score: 0,

      position: index

    };

  });

}


/* =========================================================
   GENERATE GAME CODE
========================================================= */

function generateGameCode() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (let i = 0; i < 6; i++) {

    code +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return code;

}

/* =========================================================
   TEAMS
========================================================= */

function renderTeams() {

  const container =
    document.getElementById(
      "teams"
    );


  container.innerHTML = "";


  if (
    !game ||
    !game.teams
  ) {
    return;
  }


  Object.values(game.teams)
    .forEach(team => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "team-button";


      button.innerHTML = `

        <div class="team-left">

          <span class="animal">
            ${team.emoji}
          </span>

          <span>
            ${team.name}
          </span>

        </div>

        <div class="score">
          ${formatScore(team.score)}
        </div>

      `;


      button.addEventListener(
        "click",
        () =>
          awardPoints(team.id)
      );


      container.appendChild(
        button
      );

    });

}


/* =========================================================
   AWARD POINTS
========================================================= */

async function awardPoints(teamId) {

  if (
    !game ||
    !game.started ||
    game.currentValue === null
  ) {
    return;
  }


  const teams =
    Object.values(game.teams);


  const teamIndex =
    teams.findIndex(
      team =>
        team.id === teamId
    );


  if (teamIndex === -1) {
    return;
  }


  const team =
    teams[teamIndex];


  const value =
    game.currentValue;


  const newScore =
    team.score + value;


  const nextValue =
    generatePointValue();


  const updates = {};


  updates[
    "games/" +
    gameId +
    "/teams/" +
    teamIndex +
    "/score"
  ] =
    newScore;


  updates[
    "games/" +
    gameId +
    "/lastValue"
  ] =
    value;


  updates[
    "games/" +
    gameId +
    "/lastTeamId"
  ] =
    teamId;


  updates[
    "games/" +
    gameId +
    "/currentValue"
  ] =
    nextValue;


  await update(
    ref(db),
    updates
  );

}

  .addEventListener(
    "click",
    async () => {

      if (
        !game ||
        !game.started
      ) {
        return;
      }


      await update(
        gameRef,
        {

          currentValue:
            generatePointValue(),

          lastValue: null,

          lastTeamId: null

        }
      );

    }
  );


/* =========================================================
   REASSIGN
========================================================= */

document
  .getElementById("reassign")
  .addEventListener(
    "click",
    reassignLastValue
  );


async function reassignLastValue() {

  if (
    !game ||
    game.lastValue === null ||
    !game.lastTeamId
  ) {
    return;
  }


  const teams =
    Object.values(game.teams);


  const value =
    game.lastValue;


  const oldIndex =
    teams.findIndex(
      team =>
        team.id === game.lastTeamId
    );


  if (oldIndex === -1) {
    return;
  }


  const choices =
    teams
      .filter(
        team =>
          team.id !== game.lastTeamId
      )
      .map(
        (team, index) =>
          `${index + 1}. ${team.emoji} ${team.name}`
      )
      .join("\n");


  const answer =
    prompt(
      `Reassign ${formatScore(value)} to:\n\n${choices}\n\nEnter the team number:`
    );


  if (!answer) {
    return;
  }


  const choice =
    Number(answer) - 1;


  const availableTeams =
    teams.filter(
      team =>
        team.id !== game.lastTeamId
    );


  if (
    choice < 0 ||
    choice >= availableTeams.length
  ) {
    return;
  }


  const newTeam =
    availableTeams[choice];


  const newIndex =
    teams.findIndex(
      team =>
        team.id === newTeam.id
    );


  const updates = {};


  updates[
    "games/" +
    gameId +
    "/teams/" +
    oldIndex +
    "/score"
  ] =
    teams[oldIndex].score -
    value;


  updates[
    "games/" +
    gameId +
    "/teams/" +
    newIndex +
    "/score"
  ] =
    teams[newIndex].score +
    value;


  updates[
    "games/" +
    gameId +
    "/lastTeamId"
  ] =
    newTeam.id;


  await update(
    ref(db),
    updates
  );

}


/* =========================================================
   TIMER
========================================================= */

function renderTimer() {

  const element =
    document.getElementById(
      "timerDisplay"
    );


  if (
    !game ||
    game.timerSeconds === null ||
    game.timerSeconds === undefined
  ) {

    element.textContent = "";

    element.classList.remove(
      "warning"
    );

    return;

  }


  element.textContent =
    formatTime(
      game.timerSeconds
    );


  if (
    game.timerSeconds <= 60
  ) {

    element.classList.add(
      "warning"
    );

  } else {

    element.classList.remove(
      "warning"
    );

  }

}


/* =========================================================
   START TIMER
========================================================= */

document
  .getElementById("setTimer")
  .addEventListener(
    "click",
    startTimer
  );


async function startTimer() {

  const minutes =
    Number(
      document.getElementById(
        "timerMinutes"
      ).value
    ) || 0;


  const seconds =
    Number(
      document.getElementById(
        "timerSeconds"
      ).value
    ) || 0;


  const total =
    minutes * 60 +
    seconds;


  if (total <= 0) {
    return;
  }


  await update(
    gameRef,
    {
      timerSeconds: total
    }
  );


  startLocalTimer();

}


function startLocalTimer() {

  if (
    timerInterval !== null
  ) {

    clearInterval(
      timerInterval
    );

  }


  timerInterval =
    setInterval(
      async () => {

        if (!game) {
          return;
        }


        if (
          game.timerSeconds === null ||
          game.timerSeconds === undefined
        ) {
          return;
        }


        if (
          game.timerSeconds <= 0
        ) {

          clearInterval(
            timerInterval
          );

          timerInterval = null;

          return;

        }


        const next =
          game.timerSeconds - 1;


        await update(
          gameRef,
          {
            timerSeconds: next
          }
        );

      },
      1000
    );

}


/* =========================================================
   STOP TIMER
========================================================= */

document
  .getElementById("stopTimer")
  .addEventListener(
    "click",
    stopTimer
  );


async function stopTimer() {

  if (
    timerInterval !== null
  ) {

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }


  await update(
    gameRef,
    {
      timerSeconds: null
    }
  );

}


/* =========================================================
   FINISH GAME
========================================================= */

document
  .getElementById("finishGame")
  .addEventListener(
    "click",
    finishGame
  );


async function finishGame() {

  if (!game) {
    return;
  }


  if (
    !confirm(
      "Finish the game?"
    )
  ) {
    return;
  }


  if (
    timerInterval !== null
  ) {

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }


  await update(
    gameRef,
    {
      started: false,

      timerSeconds: null

    }
  );

}


/* =========================================================
   NEW GAME
========================================================= */

document
  .getElementById("newGame")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "teacher.html";

    }
  );


/* =========================================================
   FORMATTING
========================================================= */

function formatScore(value) {

  if (value > 0) {

    return "+" + value;

  }

  return String(value);

}


function formatTime(totalSeconds) {

  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0")
  );

}


/* =========================================================
   INITIALIZE SETUP
========================================================= */

createAlphabet();

</script>
