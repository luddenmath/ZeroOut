<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zero Out — Teacher</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 20px;
    }

    #teacherApp {
      width: min(700px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.1em;
    }

    .game-code {
      color: #aaa;
      font-size: 0.9rem;
    }

    .current-value {
      text-align: center;
      background: #181818;
      border: 1px solid #444;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .label {
      color: #aaa;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
    }

    #currentValue {
      font-size: 5rem;
      font-weight: bold;
      line-height: 1.1;
      margin-top: 5px;
    }

    .teams {
      display: grid;
      gap: 10px;
    }

    .team {
      display: flex;
      justify-content: space-between;
      align-items: center;

      background: #181818;

      border: 2px solid #444;
      border-radius: 12px;

      padding: 15px 20px;
    }

    .team-left {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 1.3rem;
      font-weight: bold;
    }

    .animal {
      font-size: 2rem;
    }

    .score {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .controls {
      margin-top: 25px;
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 15px;

      border-radius: 10px;
      border: 1px solid #555;

      background: #242424;
      color: white;

      font-size: 1rem;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #status {
      text-align: center;
      color: #777;
      margin-top: 15px;
      font-size: 0.85rem;
    }

  </style>

</head>


<body>

  <div id="teacherApp">

    <header>

      <h1>ZERO OUT</h1>

      <div class="game-code">
        Game: <strong id="gameCode">—</strong>
      </div>

    </header>


    <section class="current-value">

      <div class="label">
        CURRENT VALUE
      </div>

      <div id="currentValue">
        —
      </div>

    </section>


    <section
      id="teams"
      class="teams"
    >
      <!-- Teams appear here -->
    </section>


    <section class="controls">

      <button>
        NEW VALUE
      </button>

      <button>
        REASSIGN LAST VALUE
      </button>

      <button>
        FINISH GAME
      </button>

    </section>


    <div id="status">
      Connecting to Firebase...
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getDatabase,
      ref,
      onValue
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyAPWLBaAg5DTMlw22599dLRbPDnKFObaMs",

      authDomain:
        "zeroout-7dace.firebaseapp.com",

      projectId:
        "zeroout-7dace",

      storageBucket:
        "zeroout-7dace.firebasestorage.app",

      messagingSenderId:
        "611625896840",

      appId:
        "1:611625896840:web:afb1b0c5a00d5a00d5a0dd21d521c83d",

      measurementId:
        "G-K1CFL39EHJ"

    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getDatabase(app);


    /*
      TEMPORARY GAME ID

      We're using the game you already created:

      X43PVA
    */

    const gameId = "X43PVA";


    document.getElementById(
      "gameCode"
    ).textContent = gameId;


    /*
      Listen for changes to the game.
    */

    const gameRef =
      ref(
        db,
        "games/" + gameId
      );


    onValue(
      gameRef,
      snapshot => {

        const game =
          snapshot.val();


        if (!game) {

          document.getElementById(
            "status"
          ).textContent =
            "Game not found.";

          return;

        }


        document.getElementById(
          "status"
        ).textContent =
          "Connected";


        renderGame(game);

      }

    );


    function renderGame(game) {

      /*
        Current value
      */

      const value =
        document.getElementById(
          "currentValue"
        );


      if (
        game.currentValue === null ||
        game.currentValue === undefined
      ) {

        value.textContent = "—";

      }

      else {

        value.textContent =
          formatScore(
            game.currentValue
          );

      }


      /*
        Teams
      */

      const container =
        document.getElementById(
          "teams"
        );


      container.innerHTML = "";


      if (!game.teams) {
        return;
      }


      game.teams.forEach(team => {

        const element =
          document.createElement("div");


        element.className =
          "team";


        element.innerHTML = `

          <div class="team-left">

            <span class="animal">
              ${team.emoji}
            </span>

            <span>
              ${team.name}
            </span>

          </div>

          <div class="score">
            ${formatScore(team.score)}
          </div>

        `;


        container.appendChild(
          element
        );

      });

    }


    function formatScore(value) {

      if (value > 0) {
        return "+" + value;
      }

      return String(value);

    }

  </script>

</body>

</html>
